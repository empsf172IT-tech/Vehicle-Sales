<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apex Automotive Sales Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#B38B59',
                        primaryDark: '#967448',
                        darkBg: '#0f1115',
                        darkSurface: '#16191f',
                        darkCard: '#1c1f26',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-darkBg text-gray-900 dark:text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">
    <!-- Back to home -->
    <a href="index.html" class="absolute top-8 left-8 text-sm font-medium text-gray-500 hover:text-primary transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Home
    </a>

    <div class="w-full max-w-md bg-white dark:bg-darkSurface rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-800 p-8 sm:p-10 relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-primary/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-blue-500/10 rounded-full blur-3xl"></div>

        <div class="relative z-10">
            <div class="text-center mb-10">
                <div class="flex items-center justify-center gap-2 mb-4">
                    <div class="w-10 h-10 bg-primary rounded flex items-center justify-center text-white font-heading font-bold text-xl shadow-lg">A</div>
                    <span class="font-heading font-bold text-2xl tracking-tight">APEX</span>
                </div>
                <h1 class="text-2xl font-heading font-bold text-gray-900 dark:text-white mb-2">Welcome Back</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm">Sign in to continue your learning journey.</p>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <button class="w-full flex items-center justify-center gap-2 bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 text-gray-700 dark:text-gray-300 px-4 py-3 rounded-lg font-medium transition-colors">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
                <button class="w-full flex items-center justify-center gap-2 bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 text-gray-700 dark:text-gray-300 px-4 py-3 rounded-lg font-medium transition-colors">
                    <svg class="w-5 h-5 text-black dark:text-white" fill="currentColor" viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
                    Apple
                </button>
            </div>

            <div class="flex items-center gap-4 mb-6">
                <div class="h-px bg-gray-200 dark:bg-gray-700 flex-1"></div>
                <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">Or email</span>
                <div class="h-px bg-gray-200 dark:bg-gray-700 flex-1"></div>
            </div>

            <form class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
                    <input type="email" class="w-full bg-gray-50 dark:bg-darkCard border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="you@example.com">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300">Password</label>
                        <a href="#" class="text-xs font-medium text-primary hover:text-primaryDark transition-colors">Forgot password?</a>
                    </div>
                    <input type="password" class="w-full bg-gray-50 dark:bg-darkCard border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="••••••••">
                </div>
                
                <button type="button" class="w-full bg-primary hover:bg-primaryDark text-white font-medium py-3 rounded-lg transition-colors shadow-lg shadow-primary/20 mt-2">Sign In</button>
            </form>

            <div class="mt-8 text-center text-sm text-gray-500 dark:text-gray-400">
                Don't have an account? <a href="signup.html" class="font-medium text-primary hover:text-primaryDark transition-colors">Sign up</a>
            </div>
        </div>
    </div>
</body>
</html>
